name: Monitoramento de Aço

on:
  schedule:
    # Roda todo dia útil às 9h e às 15h (horário de Brasília = UTC-3)
    - cron: "0 12 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

jobs:
  coletar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coleta
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}  # opcional, cadastre em brapi.dev
        run: python main.py

      - name: Salvar dados coletados (commit automático)
        run: |
          git config user.name "steel-monitor-bot"
          git config user.email "bot@steel-monitor.local"
          git add data/
          git diff --staged --quiet || git commit -m "Atualiza dados de mercado [automatizado]"
          git push
